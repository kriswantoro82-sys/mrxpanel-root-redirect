<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex">
  <title>Halaman Tidak Ditemukan — MRXPANEL</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#f8fbff;background:radial-gradient(circle at 20% 10%,rgba(91,140,255,.18),transparent 26rem),linear-gradient(180deg,#06101d,#081321)}
    .card{width:min(100%,660px);padding:48px 34px;text-align:center;border:1px solid rgba(148,163,184,.18);border-radius:28px;background:rgba(17,31,51,.7);box-shadow:0 28px 90px rgba(0,0,0,.3)}
    .mark{width:54px;height:54px;margin:0 auto 24px;border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#5b8cff,#9b7cff)}
    .code{color:#7aa2ff;font-size:.82rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-size:clamp(2rem,7vw,3.3rem);line-height:1.05;letter-spacing:-.04em}
    p{max-width:500px;margin:0 auto;color:#9fb0c5;line-height:1.7}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:13px;color:#fff;text-decoration:none;font-weight:800}
    .primary{background:linear-gradient(135deg,#4d7fff,#7b67f7)}
    .ghost{border:1px solid rgba(148,163,184,.2);background:rgba(255,255,255,.04)}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">M</div>
    <div class="code">404</div>
    <h1>Halaman tidak ditemukan.</h1>
    <p>Alamat yang Anda buka tidak tersedia. Kembali ke halaman utama MRXPANEL atau masuk langsung ke Member Area.</p>
    <div class="actions">
      <a class="primary" href="https://mrxpanel.com/">Kembali ke Beranda</a>
      <a class="ghost" href="https://member.mrxpanel.com/">Member Area</a>
    </div>
  </main>
</body>
</html>
