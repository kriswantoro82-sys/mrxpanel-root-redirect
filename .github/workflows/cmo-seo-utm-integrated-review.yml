name: MRXPANEL PR26 SEO + UTM isolated integration
# Candidate-only checks: PR26 -> PR25 review, or final PR25 -> main.
# Job guards below prevent candidate-specific requirements on unrelated main PRs.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main, cmo/gen8-seo-text-only-review-20261030]
permissions:
  contents: read
jobs:
  static-and-source-pins:
    if: github.event.pull_request.base.ref == 'cmo/gen8-seo-text-only-review-20261030' || github.event.pull_request.head.ref == 'cmo/gen8-seo-text-only-review-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact unchanged SEO PR25 base before integration
        if: github.event.pull_request.base.ref == 'cmo/gen8-seo-text-only-review-20261030'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/cmo/gen8-seo-text-only-review-20261030
          test "$(git rev-parse FETCH_HEAD)" = "4363724ad2c3029bf1b3de136cc0bcdbd9ee5455"
      - name: Check exact static SEO and signup safety assertions
        run: |
          python3 scripts/seo_review_check.py
          node qa/signup-utm-bridge-review.test.cjs
  mock-only-browser-integration:
    if: github.event.pull_request.base.ref == 'cmo/gen8-seo-text-only-review-20261030' || github.event.pull_request.head.ref == 'cmo/gen8-seo-text-only-review-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium QA dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify browser redirect and JS-disabled fallback with intercepted Member
        run: node qa/signup-utm-bridge-browser.test.cjs
      - name: Verify exact combined homepage CTA through signup to isolated Member
        run: node qa/homepage-signup-utm-journey.test.cjs

  pages-output-boundary:
    name: pages-output-boundary
    if: github.event.pull_request.base.ref == 'cmo/gen8-seo-text-only-review-20261030' || github.event.pull_request.head.ref == 'cmo/gen8-seo-text-only-review-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout combined PR26 source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source and Jekyll exclusion guards offline
        run: |
          node qa/main-safety-baseline.cjs --self-test
          node qa/seo-postdeploy-live-smoke.cjs --self-test
          node qa/seo-pages-artifact.test.cjs --self-test
      - name: Build GitHub Pages preview artifact only, never deploy
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated seven-page website excludes internal QA and review source
        run: node qa/seo-pages-artifact.test.cjs --path=./_site
