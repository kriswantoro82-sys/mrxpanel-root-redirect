name: MRXPANEL PR19 Draft OG Review Gate
# Always run on Draft status transitions, including ready_for_review.
# No paths filter: a non-OG code change must not suppress the release gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
permissions:
  contents: read
jobs:
  og-release-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify required PR status-transition triggers are not path-filtered
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/seo-og-pr19-draft-gate.yml').read_text()
          assert 'types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]' in s
          trigger = s.split('on:\n  pull_request:',1)[1].split('\npermissions:',1)[0]
          assert '\n    paths:' not in trigger, 'Release check must not be path-filtered'
          assert '\n    branches: [main]' in trigger
          assert 'if: github.event.pull_request.draft == false' in s
          print('OG_PR19_STATUS_TRANSITION_TRIGGER_QA_PASS|READY_FOR_REVIEW_COVERED')
          PY
      - name: Validate seven pages and explicit review hold
        if: github.event.pull_request.draft == true
        run: |
          python3 qa/seo-og-draft-guard.py --mode review
          if python3 qa/seo-og-draft-guard.py --mode release >/tmp/og-negative.log 2>&1; then
            echo "UNAUTHORIZED_OG_RELEASE_WAS_ACCEPTED" >&2
            exit 1
          fi
          if ! grep -Eq 'OWNER_VISUAL_CHOICE_REQUIRED|PRODUCTION_APPROVAL_REQUIRED' /tmp/og-negative.log; then
            echo "UNEXPECTED_OG_RELEASE_GATE_FAILURE" >&2
            cat /tmp/og-negative.log >&2
            exit 1
          fi
      - name: Reject swapped or arbitrary PNG digests and forged approval flags
        run: python3 qa/seo-og-choice-sha-negative.py
      - name: Verify selected A/B can remain Draft without production authorization
        run: python3 qa/seo-og-design-stage-regression.py
      - name: Fail closed if promoted without asset and approvals
        if: github.event.pull_request.draft == false
        run: python3 qa/seo-og-draft-guard.py --mode release
