name: MRXPANEL Legacy Redirect and Favicon SEO QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'auth/login/index.html'
      - 'auth/register/index.html'
      - 'qa/legacy-auth-bridges.test.cjs'
      - 'favicon.ico'
      - 'favicon-mrx.svg'
      - 'qa/favicon-ico.test.cjs'
      - 'qa/legacy-auth-favicon-live-smoke.cjs'
      - '.github/workflows/legacy-auth-bridges-qa.yml'

permissions:
  contents: read

jobs:
  legacy-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout of proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify legacy redirect SEO safeguards
        run: node qa/legacy-auth-bridges.test.cjs
      - name: Verify MRXPANEL favicon at default browser path
        run: node qa/favicon-ico.test.cjs
      - name: Validate manual-only read-only public smoke script syntax
        run: node --check qa/legacy-auth-favicon-live-smoke.cjs
