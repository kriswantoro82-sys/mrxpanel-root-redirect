name: MRXPANEL Signup UTM Bridge Review (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'signup/index.html'
      - 'qa/signup-utm-bridge-review.test.cjs'
      - '.github/workflows/signup-utm-bridge-review.yml'
permissions:
  contents: read
jobs:
  static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed destination and UTM allowlist offline
        run: node qa/signup-utm-bridge-review.test.cjs
