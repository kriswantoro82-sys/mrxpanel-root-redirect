name: MRXPANEL OG A-B Owner Visual Review Reproducibility
# Generates exact design review artifacts ONLY; no changes to repo/main/Pages.
on:
  push:
    branches:
      - review/og7-on-pr25-unapproved-20261031
permissions:
  contents: read
jobs:
  generate-owner-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Python review toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline image libraries
        run: python -m pip install "Pillow==12.3.0"
      - name: Inspect owner artwork approval state
        id: state
        run: |
          echo "review_only=$(python -c 'import json; m=json.load(open("review/og-seven-on-pr25-20261031/REVIEW_ONLY_RELEASE_GATE.json")); print(str(m["owner_visual_approved"] is False).lower())')" >> "$GITHUB_OUTPUT"
      - name: Reproduce exact pinned A and B visual previews
        if: steps.state.outputs.review_only == 'true'
        run: |
          python review/og-seven-on-pr25-20261031/generate-review-A-B.py \
            "${{ runner.temp }}/mrxpanel-og-owner-review-AB"
      - name: Upload visual review artifact (not website media)
        if: steps.state.outputs.review_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MRXPANEL_OG_A_B_OWNER_REVIEW_ONLY
          path: ${{ runner.temp }}/mrxpanel-og-owner-review-AB/*
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact owner-approved B already staged in review branch
        if: steps.state.outputs.review_only == 'false'
        shell: bash
        run: |
          set -euo pipefail
          expected="1508d09e5c99850457e5dd05501f7bd22bdc398d21c415592351267bf3ca74c8"
          actual=$(sha256sum assets/mrxpanel-og-1200x630.png | cut -d' ' -f1)
          test "$actual" = "$expected"
          python - <<'PY'
          from PIL import Image
          with Image.open("assets/mrxpanel-og-1200x630.png") as im:
              assert im.size == (1200,630) and im.mode == "RGB"
          PY
          echo "APPROVED_B_EXISTING_ASSET_VERIFIED=TRUE"
      - name: Report non-production gate accurately
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.review_only }}" = "true" ]; then
            echo "PREAPPROVAL_A_B_PREVIEW_REGENERATED=TRUE"
          else
            echo "PREAPPROVAL_A_B_PREVIEW_REGENERATION=SKIPPED"
            echo "APPROVED_B_EXISTING_ASSET=CHECKSUM_VERIFIED"
          fi
          echo "PRODUCTION_RELEASE=HOLD"
          echo "NO_SITE_DEPLOY_NO_GIT_WRITE"
