name: MRXPANEL Homepage Legal Identity Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'qa/homepage-legal-identity.test.cjs'
      - '.github/workflows/homepage-legal-identity-qa.yml'

permissions:
  contents: read

jobs:
  legal-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout draft homepage
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify visible legal operator and structured-data alignment
        run: node qa/homepage-legal-identity.test.cjs
