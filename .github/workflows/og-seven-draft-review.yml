name: MRXPANEL OG7 Draft Review Integrity
# PR27 review-only: success never authorizes deploying the asset.
on:
  push:
    branches:
      - review/og7-on-pr25-unapproved-20261031
  pull_request:
    branches:
      - cmo/gen8-seo-text-only-review-20261030
permissions:
  contents: read
jobs:
  review-only-gate:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'review/og7-on-pr25-unapproved-20261031') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/og7-on-pr25-unapproved-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials, include exact PR25 baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify seven pages in unapproved or approved-but-held staging state
        shell: bash
        run: |
          set -euo pipefail
          mode=$(node -e 'const m=require("./review/og-seven-on-pr25-20261031/REVIEW_ONLY_RELEASE_GATE.json"); if(m.owner_visual_approved===false)process.stdout.write("review"); else if(m.owner_visual_approved===true)process.stdout.write("approved-artwork-review"); else process.exit(1)')
          node qa/og-seven-pr27-gate.cjs "--mode=$mode"
      - name: Ensure production gate fails closed without separate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if node qa/og-seven-pr27-gate.cjs --mode=release > /tmp/release-gate.log 2>&1; then
            echo "ERROR: unapproved OG7 was accepted for production"; exit 1
          fi
          if ! grep -q 'OG7_GATE_FAIL:RELEASE_HOLD_EXTERNAL_REVIEW_AND_OWNER_AUTH_REQUIRED' /tmp/release-gate.log; then
            echo "ERROR: release gate failed for unexpected reason"; cat /tmp/release-gate.log; exit 1
          fi
          echo 'OG7_REVIEW_QA=PASS; OG7_PRODUCTION_RELEASE=HOLD; NO_DEPLOY'

  synthetic-approved-staging-gate:
    name: synthetic-approved-staging-gate
    if: >-
      (github.event_name == 'push' && github.ref_name == 'review/og7-on-pr25-unapproved-20261031') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/og7-on-pr25-unapproved-20261031')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout complete history (no push credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible image fixture dependency
        run: python -m pip install "Pillow==12.3.0"
      - name: Test both selected-artwork states in disposable worktree
        run: python qa/og-seven-staged-synthetic-qa.py


  preview-built-pages-b-artifact:
    name: preview-built-pages-b-artifact
    # Build proposed Pages output in CI ONLY. No artifact upload, publish or deploy.
    if: >-
      (github.event_name == 'push' && github.ref_name == 'review/og7-on-pr25-unapproved-20261031') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'review/og7-on-pr25-unapproved-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout draft exact source, with no push credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build GitHub Pages Jekyll preview without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check Pages output boundary and exact approved B asset
        shell: bash
        run: |
          set -euo pipefail
          node qa/seo-pages-artifact.test.cjs --path=./_site
          node - <<'NODE'
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          const m=require("./review/og-seven-on-pr25-20261031/REVIEW_ONLY_RELEASE_GATE.json");
          const asset="assets/mrxpanel-og-1200x630.png";
          const expectedHash="1508d09e5c99850457e5dd05501f7bd22bdc398d21c415592351267bf3ca74c8";
          assert.equal(m.owner_visual_approved,true);
          assert.equal(m.selected_candidate,"B");
          assert.equal(m.asset_included,true);
          assert.equal(m.asset_live,false);
          assert.equal(m.production_authorized,false);
          assert.equal(m.release_blocked,true);
          const bytes=fs.readFileSync("_site/"+asset);
          assert.equal(bytes.subarray(0,8).toString("hex"),"89504e470d0a1a0a");
          assert.equal(bytes.readUInt32BE(16),1200);
          assert.equal(bytes.readUInt32BE(20),630);
          assert.equal(crypto.createHash("sha256").update(bytes).digest("hex"),expectedHash);
          const routes=[
            "index.html","panduan-reseller/index.html","cara-menggunakan-panel-smm/index.html",
            "memilih-provider-smm/index.html","apa-itu-panel-smm/index.html",
            "api-panel-smm-reseller/index.html","kalkulator-harga-jual-reseller-smm/index.html"
          ];
          const expectedUrl="https://mrxpanel.com/"+asset;
          for(const route of routes){
            const html=fs.readFileSync("_site/"+route,"utf8");
            for(const key of ["og:image","og:image:secure_url","twitter:image"]){
              const match=[...html.matchAll(/<meta\b[^>]*>/gi)]
                .map(x=>x[0])
                .filter(tag=>tag.includes('="'+key+'"'));
              assert.equal(match.length,1,"MISSING_BUILT_META:"+route+":"+key);
              assert.ok(match[0].includes('content="'+expectedUrl+'"'),"WRONG_BUILT_META:"+route+":"+key);
            }
          }
          console.log("OG7_BUILT_PAGES_B_IMAGE_SHA256_PASS=TRUE");
          console.log("OG7_BUILT_META_AND_SITE_ASSET_PASS=7/7");
          console.log("OG7_PREVIEW_BUILD_ONLY_PRODUCTION_RELEASE=HOLD");
          NODE
