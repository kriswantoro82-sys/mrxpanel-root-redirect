name: MRXPANEL Public HTTP Observation (Draft, GET only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo-public-get-observation.yml'

permissions:
  contents: read

jobs:
  live-observation:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Observe public URLs, GET only (not release QA)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observation
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import re
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          host = 'https://mrxpanel.com'
          paths = [
              '/', '/panduan-reseller/', '/cara-menggunakan-panel-smm/',
              '/memilih-provider-smm/', '/apa-itu-panel-smm/',
              '/api-panel-smm-reseller/', '/kalkulator-harga-jual-reseller-smm/',
              '/sitemap.xml', '/assets/mrxpanel-og-1200x630.png',
              '/favicon.ico', '/favicon-mrx.svg',
              '/auth/login/', '/auth/register/', '/signup/', '/signin/'
          ]
          routes = paths[:7]

          class PageTags(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canonicals = []
                  self.robots = []
                  self.refresh = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'link' and a.get('rel') == 'canonical':
                      self.canonicals.append(a.get('href'))
                  elif tag == 'meta':
                      if a.get('name') == 'robots':
                          self.robots.append(a.get('content'))
                      if a.get('http-equiv', '').lower() == 'refresh':
                          self.refresh.append(a.get('content'))
                  elif tag == 'a':
                      self.links.append(a.get('href'))

          expected_og_b_sha256 = '2f4faac685007209ff85228dd2a7a88647fa1a03a384b40f780ce74057035514'
          expected_ico_sha256 = 'd665d7c54f9af6c016be108b43be2d2de3965581326d377fc3f5a7b6795b2d07'
          markers = {
              '/': 'Bagaimana jika email verifikasi pendaftaran tidak diterima?',
              '/cara-menggunakan-panel-smm/': 'kalkulator harga jual dan laba bersih reseller',
              '/apa-itu-panel-smm/': 'kalkulator harga jual reseller SMM',
              '/api-panel-smm-reseller/': 'kalkulator harga jual dan laba bersih reseller',
          }
          out = []
          for path in paths:
              req = urllib.request.Request(
                  host + path,
                  method='GET',
                  headers={
                      'User-Agent': 'MRXPANEL-SEO-ReadOnly-Observation/1.0',
                      'Accept': 'text/html,application/xml,image/png,image/x-icon,image/svg+xml,*/*',
                      'Cache-Control': 'no-cache',
                  },
              )
              row = {'path': path}
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      data = r.read(2_000_000)
                      row.update({
                          'status': r.status,
                          'final_url': r.geturl(),
                          'content_type': r.headers.get('Content-Type'),
                          'date_header': r.headers.get('Date'),
                          'etag': r.headers.get('ETag'),
                          'bytes_read': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                      })
                      if path in routes or path in ('/auth/login/', '/auth/register/'):
                          html = data.decode('utf-8', errors='replace')
                          tags = PageTags()
                          tags.feed(html)
                          if path in routes:
                              row['canonical_exact'] = tags.canonicals == [host + path]
                              row['robots_index_follow_exact'] = tags.robots == ['index,follow']
                              row['has_h1'] = re.search(r'<h1\b', html, re.I) is not None
                          else:
                              row['noindex_follow_present'] = tags.robots == ['noindex,follow']
                              row['member_bridge_verified'] = (
                                  tags.refresh == ['0; url=https://member.mrxpanel.com/']
                                  and 'https://member.mrxpanel.com/' in tags.links
                                  and re.search(r'<form\b', html, re.I) is None
                              )
                      if path in markers:
                          row['pr19_marker_present'] = markers[path] in data.decode('utf-8', errors='replace')
                      if path == '/sitemap.xml':
                          try:
                              tree = ET.fromstring(data)
                              ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
                              items = tree.findall(ns + 'url')
                              found = [(x.findtext(ns + 'loc'), x.findtext(ns + 'lastmod')) for x in items]
                              row['sitemap_seven_canonical_valid'] = (
                                  len(found) == len(routes)
                                  and [url for url, _ in found] == [host + p for p in routes]
                                  and all(
                                      d and re.fullmatch(r'\d{4}-\d{2}-\d{2}', d)
                                      and datetime.date.fromisoformat(d)
                                      for _, d in found
                                  )
                              ) is True
                              row['sitemap_lastmod'] = {p: d for p, d in found}
                          except (ValueError, ET.ParseError, AttributeError) as exc:
                              row['sitemap_seven_canonical_valid'] = False
                              row['sitemap_parse_error'] = type(exc).__name__
                      if path == '/assets/mrxpanel-og-1200x630.png':
                          row['exact_candidate_b'] = row['sha256'] == expected_og_b_sha256
                      if path == '/favicon.ico':
                          row['exact_pr21_ico'] = row['sha256'] == expected_ico_sha256
              except urllib.error.HTTPError as exc:
                  row.update({'status': exc.code, 'final_url': exc.url, 'error_type': 'HTTPError'})
              except Exception as exc:
                  row.update({'status': None, 'error_type': type(exc).__name__, 'error': str(exc)[:160]})
              out.append(row)
              print('OBSERVATION ' + json.dumps(row, ensure_ascii=False))
          # Count HTTP responses and successful targets SEPARATELY.
          # An HTTP 404 is reachable, but it is not a published SEO asset.
          responses = sum(isinstance(r.get('status'), int) for r in out)
          success_200 = sum(r.get('status') == 200 for r in out)
          observed = {r['path']: r for r in out}
          missing = [r['path'] for r in out if r.get('status') == 404]
          errors = [r['path'] for r in out if r.get('status') is None]
          canonical_seven = all(
              observed[p].get('canonical_exact') is True
              and observed[p].get('robots_index_follow_exact') is True
              and observed[p].get('has_h1') is True
              for p in routes
          )
          sitemap_seven = observed['/sitemap.xml'].get('sitemap_seven_canonical_valid') is True
          member_auth_bridges = all(
              observed[p].get('member_bridge_verified') is True
              for p in ('/auth/login/', '/auth/register/')
          )
          pr19_markers = all(observed[p].get('pr19_marker_present') is True for p in markers)
          pr21_noindex = all(
              observed[p].get('noindex_follow_present') is True
              for p in ('/auth/login/', '/auth/register/')
          )
          og_b_exact = observed['/assets/mrxpanel-og-1200x630.png'].get('exact_candidate_b') is True
          pr21_ico_exact = observed['/favicon.ico'].get('exact_pr21_ico') is True
          all_urls_200 = success_200 == len(paths)
          draft_targets_observed = (
              all_urls_200 and canonical_seven and sitemap_seven
              and member_auth_bridges and pr19_markers and pr21_noindex
              and og_b_exact and pr21_ico_exact
          )
          # Fail-closed local regression: never confuse a 404 with success.
          assert not (len(missing) and all_urls_200)
          assert not (len(missing) and draft_targets_observed)
          assert not (not canonical_seven and draft_targets_observed)
          assert not (not sitemap_seven and draft_targets_observed)
          assert not (not member_auth_bridges and draft_targets_observed)
          report = {
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'scope': 'PUBLIC_GET_ONLY_NO_LOGIN_NO_PRODUCTION_WRITES_NOT_RELEASE_AUTHORIZATION',
              'reachable_http_responses': responses,
              'http_200_responses': success_200,
              'total_urls': len(paths),
              'all_urls_http_200': all_urls_200,
              'http_404_paths': missing,
              'unreachable_paths': errors,
              'canonical_robots_h1_seven_valid': canonical_seven,
              'sitemap_seven_urls_and_dates_valid': sitemap_seven,
              'member_auth_bridges_both_valid': member_auth_bridges,
              'pr19_content_markers_all_present': pr19_markers,
              'pr21_auth_noindex_both_present': pr21_noindex,
              'og_png_exact_candidate_b_live': og_b_exact,
              'pr21_favicon_ico_exact_live': pr21_ico_exact,
              'draft_targets_observed': draft_targets_observed,
              'note': 'CI success means observation report generated, NOT release authorization, visual approval or Google indexing.',
              'results': out,
          }
          Path('observation/public-get-report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('MRXPANEL_PUBLIC_OBSERVATION=' + json.dumps({
              'reachable_http_responses': responses,
              'http_200_responses': success_200,
              'total_urls': len(paths),
              'http_404_paths': missing,
              'canonical_robots_h1_seven_valid': canonical_seven,
              'sitemap_seven_urls_and_dates_valid': sitemap_seven,
              'member_auth_bridges_both_valid': member_auth_bridges,
              'draft_targets_observed': draft_targets_observed,
              'report_only': True,
          }))
          PY
      - name: Preserve source-independent observation evidence for seven days
        uses: actions/upload-artifact@v4
        with:
          name: mrxpanel-public-get-observation-draft
          path: observation/public-get-report.json
          if-no-files-found: error
          retention-days: 7
