name: MRXPANEL Member Anonymous UI Review (GET-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/member-anonymous-ui-readonly-browser.cjs'
      - 'qa/member-anon-register-navigation-review.cjs'
      - '.github/workflows/member-anonymous-ui-review.yml'
permissions:
  contents: read
jobs:
  anonymous-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse read-only browser source
        run: node --check qa/member-anonymous-ui-readonly-browser.cjs
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare public anonymous login and register-intent views
        run: node qa/member-anonymous-ui-readonly-browser.cjs
      - name: Check one public registration navigation without form submission
        run: node qa/member-anon-register-navigation-review.cjs
