name: MRXPANEL SEO Text-Only Candidate QA
# Review-only; deliberately scoped to this candidate branch.
# Must never become a global production release gate or block a later approved OG image.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  push:
    branches: [cmo/gen8-seo-text-only-review-20261030]
permissions:
  contents: read
jobs:
  validate-text-only:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'cmo/gen8-seo-text-only-review-20261030') ||
      (github.event_name == 'push' && github.ref_name == 'cmo/gen8-seo-text-only-review-20261030')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject missing or unapproved OG media and verify metadata
        run: node qa/seo-text-only-social-qa.cjs
      - name: Verify Article dates and retain separate release approval
        run: node qa/seo-release-date-review.cjs --mode=review
      - name: Audit all seven SEO pages for broken and unreachable internal links
        run: node qa/seo-seven-page-link-audit.cjs --self-test
      - name: Simulate selective publication date changes without writing files
        run: node qa/seo-publication-date-preview.cjs --self-test
      - name: Verify SEO content, safe legacy auth, favicon and negative cases
        run: |
          node qa/seo-article-calculator-links.cjs
          node qa/seo-canonical-negative.test.cjs
          node qa/seo-schema-only-date-negative.test.cjs
          node qa/seo-visible-prose-date-negative.test.cjs
          node qa/cmo-gen7-api-calculator-link.test.cjs
          node qa/homepage-legal-identity.test.cjs
          node qa/legacy-auth-bridges.test.cjs
          node qa/favicon-ico.test.cjs
          node qa/tutorial-social-preview.test.cjs
      - name: Report review status without approving production
        if: always()
        run: |
          echo "SEO_TEXT_ONLY_CANDIDATE=REVIEW_ONLY"
          echo "TECHNICAL_QA_IS_NOT_PRODUCTION_AUTHORIZATION"
          echo "OWNER_CTO_APPROVAL_AND_ACTUAL_RELEASE_DATE_STILL_REQUIRED"
          echo "NO_MERGE_OR_DEPLOY_FROM_THIS_WORKFLOW"
