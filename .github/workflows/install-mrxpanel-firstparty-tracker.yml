name: Install MRXPANEL First-Party Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mrxpanel-firstparty-tracker.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index safely
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB='e58b5f7ac51bda78baf4eb9f5cb33ccd694f5a26'
          ACTUAL_BLOB="$(git hash-object index.html)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || { echo "index.html changed: $ACTUAL_BLOB"; exit 20; }

          LOADER='<script src="https://mrxpanel-tracker.mrxpanel01.workers.dev/tracker-v1.js" defer></script>'
          if grep -Fq "$LOADER" index.html; then
            echo 'Tracker loader already present; no duplicate write.'
          else
            python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          loader = '  <script src="https://mrxpanel-tracker.mrxpanel01.workers.dev/tracker-v1.js" defer></script>\n'
          anchor = '</body>\n</html>\n'
          if s.count(anchor) != 1:
              raise SystemExit('Expected closing anchor exactly once')
          if 'mrxpanel-tracker.mrxpanel01.workers.dev/tracker-v1.js' in s:
              raise SystemExit('Unexpected partial tracker marker already present')
          p.write_text(s.replace(anchor, loader + anchor, 1), encoding='utf-8')
          PY
          fi

          git diff --check
          ADDED="$(git diff --numstat -- index.html | awk '{print $1}')"
          REMOVED="$(git diff --numstat -- index.html | awk '{print $2}')"
          test "$ADDED" = '1' || { echo "Expected 1 added line, got $ADDED"; exit 21; }
          test "$REMOVED" = '0' || { echo "Expected 0 removed lines, got $REMOVED"; exit 22; }
          grep -Fq "$LOADER" index.html

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-mrxpanel-firstparty-tracker.yml
          git add index.html
          git diff --cached --check
          git commit -m 'feat: add MRXPANEL first-party analytics tracker'
          git push origin HEAD:main
