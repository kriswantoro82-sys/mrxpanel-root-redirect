<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>MAYA — Personal AI Presence</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;--gold:#f1cc6c;--line:#2a2f38;--muted:#9297a0;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b10;color:#fff}body{min-height:100dvh}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 28%,rgba(241,204,108,.12),transparent 34%),linear-gradient(#0d1016,#090b10)}header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.05)}.brand{font-weight:800;letter-spacing:.14em;font-size:13px;display:flex;gap:10px;align-items:center}.brand i,.status i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:0 0 20px rgba(241,204,108,.55)}.status{font-size:12px;color:#cbd0d7;border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:#111318}.status.ready i{background:#58d995}.stage{display:grid;place-items:center;padding:18px}.presence{text-align:center;width:min(92vw,470px)}.portrait{position:relative;width:min(76vw,360px);aspect-ratio:.84;margin:auto;filter:drop-shadow(0 28px 70px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.hairBack{position:absolute;inset:6% 8% 4%;background:linear-gradient(160deg,#2b2724,#0d0d10 70%);border-radius:48% 48% 38% 38%}.neck{position:absolute;left:37%;bottom:4%;width:26%;height:21%;border-radius:0 0 40px 40px;background:linear-gradient(#d9aa91,#b97f6d)}.body{position:absolute;left:2%;right:2%;bottom:-4%;height:25%;border-radius:50% 50% 0 0;background:linear-gradient(155deg,#1a1d23,#252b35);border-top:1px solid rgba(241,204,108,.22)}.face{position:absolute;left:18%;top:12%;width:64%;height:70%;border-radius:46% 46% 44% 44%/42% 42% 54% 54%;background:linear-gradient(155deg,#f0c4aa,#dba088 62%,#c58875);box-shadow:inset -18px -14px 36px rgba(95,55,48,.14),inset 12px 10px 28px rgba(255,255,255,.11)}.hairTop{position:absolute;left:13%;top:6%;width:74%;height:33%;background:linear-gradient(160deg,#2b2724,#111116);border-radius:50% 50% 24% 32%;transform:rotate(-2deg)}.side{position:absolute;top:18%;width:18%;height:58%;border-radius:50%;background:linear-gradient(#211e1c,#0f1013)}.side.l{left:9%;transform:rotate(7deg)}.side.r{right:9%;transform:rotate(-7deg)}.brow{position:absolute;top:38%;width:17%;height:4px;border-radius:4px;background:#543a31}.brow.l{left:27%;transform:rotate(-4deg)}.brow.r{right:27%;transform:rotate(4deg)}.eye{position:absolute;top:44%;width:12%;height:5.5%;border-radius:50%;background:#fff;overflow:hidden;transform-origin:center;transition:transform .07s}.eye.l{left:30%}.eye.r{right:30%}.eye.blink{transform:scaleY(.08)}.iris{position:absolute;width:48%;aspect-ratio:1;border-radius:50%;left:26%;top:-14%;background:#564236;box-shadow:inset 0 0 0 2px #2b2420}.pupil{position:absolute;width:34%;aspect-ratio:1;border-radius:50%;left:33%;top:22%;background:#08090b}.nose{position:absolute;left:49%;top:50%;height:17%;border-left:2px solid rgba(102,63,55,.22)}.mouth{position:absolute;left:42%;top:69%;width:16%;height:10px;border-radius:5px 5px 16px 16px;background:#874c55;border:1px solid rgba(83,45,49,.28);transform-origin:center;transition:height .045s}.name{font-size:26px;font-weight:800;letter-spacing:.18em;margin-top:8px}.sub{font-size:13px;color:var(--muted);margin-top:6px}.copy{min-height:48px;margin:14px auto 0;max-width:620px;color:#d9dde2;font-size:14px;line-height:1.5}footer{width:min(100%,760px);margin:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));display:grid;gap:10px}.actions,.textrow{display:flex;gap:9px;justify-content:center}.textrow input{flex:1;min-width:0;max-width:560px;border:1px solid var(--line);background:#111318;color:#fff;padding:12px 13px;border-radius:13px;outline:none}.btn{border:1px solid var(--line);background:#171a20;color:#fff;border-radius:13px;padding:12px 16px;font-weight:700}.btn.primary{background:linear-gradient(#f2d27b,#d6a73a);color:#17120a;border-color:#d6a73a}.btn.danger{background:#211419;border-color:#4d2931;color:#ffdfe5}.hidden{display:none!important}.login{position:fixed;inset:0;z-index:20;background:rgba(5,6,9,.87);backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px}.card{width:min(100%,420px);border:1px solid var(--line);background:linear-gradient(#171a20,#101217);border-radius:23px;padding:23px;box-shadow:0 30px 100px rgba(0,0,0,.55)}.card h2{margin:0 0 7px}.card p{color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;color:#b9bec6}.field input{border:1px solid var(--line);background:#0d0f13;color:#fff;padding:12px 13px;border-radius:12px}.msg{min-height:19px;font-size:12px;color:#ffb4bd;margin-top:7px}.health{font-size:11px;color:#747a83;text-align:center;margin-top:12px}@media(max-width:560px){.portrait{width:min(90vw,360px)}header{padding:13px}}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><i></i>MAYA PRESENCE</div><div id="status" class="status"><i></i><span>Belum masuk</span></div></header><main class="stage"><div class="presence"><div class="portrait"><div class="hairBack"></div><div class="neck"></div><div class="body"></div><div class="face"></div><div class="hairTop"></div><div class="side l"></div><div class="side r"></div><div class="brow l"></div><div class="brow r"></div><div id="eyeL" class="eye l"><div class="iris"><div class="pupil"></div></div></div><div id="eyeR" class="eye r"><div class="iris"><div class="pupil"></div></div></div><div class="nose"></div><div id="mouth" class="mouth"></div></div><div class="name">MAYA</div><div class="sub">Personal AI Presence · V1</div><div id="copy" class="copy">Masuk untuk mengaktifkan Maya.</div></div></main><footer><div class="actions"><button id="start" class="btn primary" disabled>Mulai bicara</button><button id="stop" class="btn danger hidden">Hentikan</button><button id="logout" class="btn hidden">Keluar</button></div><div id="textrow" class="textrow hidden"><input id="text" placeholder="Atau ketik pesan…" autocomplete="off"><button id="send" class="btn">Kirim</button></div></footer></div>
<div id="login" class="login"><div class="card"><h2>Masuk ke MAYA</h2><p>Gunakan akun owner MRXPANEL. Password dikirim langsung ke Supabase Auth dan tidak disimpan oleh halaman ini.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary" style="width:100%">Masuk</button><div id="loginMsg" class="msg"></div><div id="health" class="health">Memeriksa AI…</div></div></div>
<script>
(()=>{
const APP_URL='https://thymtqaxleqckzgmltwz.supabase.co';
const PUB='sb_publishable_GIbV83R1SOGqp0bIe-LcmQ_9A4_i9TU';
const OWNER='84b105ce-ea47-4abe-9867-0c54400fa608';
const BACKEND='https://xdytyjmqsiivamlwbhgj.supabase.co/functions/v1/maya-presence-v1';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('maya_presence_token')||'',pc=null,dc=null,local=null,audio=null,ctx=null,analyser=null,raf=0,assistant='';
function status(t,ready=false){$('status').querySelector('span').textContent=t;$('status').className='status'+(ready?' ready':'')}
function copy(t){$('copy').textContent=t||'Aku dengar…'}
function loggedIn(){$('login').classList.add('hidden');$('start').disabled=false;$('logout').classList.remove('hidden');$('textrow').classList.remove('hidden');status('Siap',true);copy('Tekan “Mulai bicara”, lalu bicara seperti biasa.')}
function loggedOut(m=''){$('login').classList.remove('hidden');$('start').disabled=true;$('logout').classList.add('hidden');$('textrow').classList.add('hidden');$('loginMsg').textContent=m;status('Belum masuk')}
async function health(){try{let r=await fetch(BACKEND+'?mode=health',{cache:'no-store'}),j=await r.json();$('health').textContent=j.openai_configured?'OpenAI Realtime siap.':'Wajah Maya siap. Sambungan OpenAI belum diaktifkan.'}catch{$('health').textContent='Backend Maya belum dapat dibaca.'}}
async function validate(){if(!token)return loggedOut();try{let r=await fetch(APP_URL+'/auth/v1/user',{headers:{apikey:PUB,Authorization:'Bearer '+token}});if(!r.ok)throw 0;let u=await r.json();if(u.id!==OWNER)throw 0;loggedIn()}catch{token='';sessionStorage.removeItem('maya_presence_token');loggedOut('Sesi sudah berakhir. Silakan masuk lagi.')}}
async function doLogin(){let b=$('loginBtn');b.disabled=true;$('loginMsg').textContent='';try{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Isi email dan password.');let r=await fetch(APP_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),j=await r.json();if(!r.ok||!j.access_token)throw Error(j.error_description||j.msg||'Login gagal.');token=j.access_token;sessionStorage.setItem('maya_presence_token',token);$('password').value='';await validate()}catch(e){$('loginMsg').textContent=e.message||'Login gagal.'}finally{b.disabled=false}}
function blink(){let a=$('eyeL'),b=$('eyeR');a.classList.add('blink');b.classList.add('blink');setTimeout(()=>{a.classList.remove('blink');b.classList.remove('blink')},125);setTimeout(blink,2500+Math.random()*3800)}
function animate(stream){try{ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;ctx.createMediaStreamSource(stream).connect(analyser);let data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{if(!analyser)return;analyser.getByteFrequencyData(data);let s=0;for(const v of data)s+=v;let avg=s/data.length;$('mouth').style.height=(10+Math.min(27,avg*.34))+'px';raf=requestAnimationFrame(tick)};tick()}catch{}}
function evt(raw){let e;try{e=JSON.parse(raw)}catch{return}if(e.type==='input_audio_buffer.speech_started'){status('Mendengarkan…');copy('Aku dengar…')}else if(e.type==='input_audio_buffer.speech_stopped'){status('Memikirkan jawaban…')}else if(e.type==='response.output_audio_transcript.delta'){if(!assistant)copy('');assistant+=e.delta||'';copy(assistant);status('Maya sedang bicara…')}else if(e.type==='response.output_audio_transcript.done'){if(e.transcript){assistant=e.transcript;copy(assistant)}}else if(e.type==='response.done'){status('Siap',true);assistant=''}else if(e.type==='error'){status('Ada kendala');copy(e.error?.message||'Realtime API mengembalikan error.')}}
async function start(){$('start').disabled=true;status('Menghubungkan…');copy('Menyalakan mikrofon…');try{pc=new RTCPeerConnection();audio=new Audio();audio.autoplay=true;pc.ontrack=e=>{audio.srcObject=e.streams[0];animate(e.streams[0])};local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});local.getTracks().forEach(t=>pc.addTrack(t,local));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{status('Siap mendengarkan',true);copy('Maya aktif. Silakan bicara.')};dc.onmessage=e=>evt(e.data);let offer=await pc.createOffer();await pc.setLocalDescription(offer);let r=await fetch(BACKEND+'?mode=session',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/sdp'},body:offer.sdp});if(!r.ok){let t=await r.text(),m='Gagal memulai sesi.';try{m=JSON.parse(t).error||m}catch{}throw Error(m)}await pc.setRemoteDescription({type:'answer',sdp:await r.text()});$('start').classList.add('hidden');$('stop').classList.remove('hidden')}catch(e){stop(false);$('start').disabled=false;status('Belum terhubung');copy(e.message||'Tidak dapat memulai sesi.')}}
function stop(reset=true){if(raf)cancelAnimationFrame(raf);raf=0;analyser=null;if(ctx){try{ctx.close()}catch{}ctx=null}if(local){local.getTracks().forEach(t=>t.stop());local=null}if(dc){try{dc.close()}catch{}dc=null}if(pc){try{pc.close()}catch{}pc=null}if(audio){audio.srcObject=null;audio=null}$('mouth').style.height='10px';$('stop').classList.add('hidden');$('start').classList.remove('hidden');$('start').disabled=false;status(token?'Siap':'Belum masuk',!!token);if(reset)copy(token?'Sesi dihentikan. Tekan “Mulai bicara” untuk aktif lagi.':'Masuk untuk mengaktifkan Maya.')}
function send(){let i=$('text'),t=i.value.trim();if(!t)return;if(!dc||dc.readyState!=='open')return copy('Aktifkan sesi suara terlebih dahulu.');assistant='';dc.send(JSON.stringify({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text:t}]}}));dc.send(JSON.stringify({type:'response.create'}));i.value='';status('Memikirkan jawaban…');copy(t)}
$('loginBtn').onclick=doLogin;$('password').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('start').onclick=start;$('stop').onclick=()=>stop(true);$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter')send()};$('logout').onclick=()=>{stop(false);token='';sessionStorage.removeItem('maya_presence_token');loggedOut();copy('Masuk untuk mengaktifkan Maya.')};blink();health();validate();
})();
</script>
</body>
</html>
